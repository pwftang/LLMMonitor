# LLMMonitor hub configuration. Copy to hub.toml and fill in your devices.

bind = "0.0.0.0"            # hub listen address — keep loopback unless you want to
port = 8400                 #   browse from other tailnet devices (then use this box's tailnet IP)
data_dir = "./data"         # SQLite lives here (relative to this config file)
# web_dir = "./web"         # only needed if you move the frontend; defaults to the
                            # bundled web/ directory

poll_interval = 2           # seconds between macmon + omlx /stats polls
models_interval = 5         # seconds between omlx /models polls
offline_backoff = 30        # seconds to wait before retrying an offline device
request_timeout = 5         # seconds per HTTP request

[retention]
full_res_hours = 24         # keep raw 2s samples this long
rollup_days = 30            # keep 5-minute rollups this long
rollup_seconds = 300        # rollup bucket size
route_event_days = 7        # keep routed-request records (omlx-router) this long

# One [[devices]] block per machine.
# name      — display name
# id        — optional stable id used for stored metrics; defaults to a slug of
#             name. Set it if you may rename a device later, so its history
#             stays attached to the same id.
# host      — Tailscale hostname or 100.x.y.z IP
# omlx_port — omlx admin port (default 8000); set 0 to disable omlx for a machine
# macmon_port — macmon serve port (default 9090); set 0 to disable macmon
# comfyui_port — ComfyUI port (opt-in; omit or set 0 to disable)
# host_port — hostmon agent port (opt-in; omit or set 0 to disable). hostmon is
#             the tiny host telemetry agent (disk usage, memory pressure, ...)
#             installed by macos/install-hostmon-agent.sh. The old key
#             disk_port is still accepted as an alias.
# router_port — omlx-router port (opt-in; omit or set 0 to disable). Adds router
#             health/deployments charts and, with a router key, a routed-requests
#             log. Polls /ready (public; the key is sent when set, unlocking
#             backend detail) plus the Bearer-protected /admin API.
# omlx_api_key   — omlx admin API key (opt-in; omit if omlx has no auth)
# router_api_key — omlx-router Bearer key (opt-in; omit for public /ready only)
# api_key   — DEPRECATED single-key fallback: used for whichever of omlx /
#             router has no dedicated key. Prefer omlx_api_key and
#             router_api_key on devices running both; dedicated keys are
#             never cross-sent between services.

[[devices]]
name = "Mac Studio M2 Ultra"
host = "mac-studio-m2-ultra.tailc08855.ts.net"
omlx_port = 8000
macmon_port = 9090
comfyui_port = 8188          # opt-in; omit or 0 to disable
host_port = 9091             # opt-in; hostmon agent (macos/install-hostmon-agent.sh)
omlx_api_key = "your-omlx-api-key-here"

[[devices]]
name = "Mac Studio M2 Max"
host = "patricks-mac-studio.tailc08855.ts.net"
omlx_port = 8000
macmon_port = 9090
omlx_api_key = "your-omlx-api-key-here"

[[devices]]
name = "MacBook Pro"
host = "pats-macbook-pro.tailc08855.ts.net"
omlx_port = 8000
macmon_port = 9090
omlx_api_key = "your-omlx-api-key-here"

# A machine that only runs omlx-router (e.g. a Linux LXC with no macmon/omlx):
# disable the other sources and set router_api_key to the router's Bearer key
# to get the deployments/in-flight stats and the routed-requests log. Omit the
# key entirely to poll public /ready only (minimal readiness, no admin panels).
# A 401 from /admin never marks a router that answers /ready as offline — the
# admin metrics are simply omitted.
# [[devices]]
# name = "Router LXC"
# host = "omlx-router.tailc08855.ts.net"
# omlx_port = 0
# macmon_port = 0
# router_port = 8000
# router_api_key = "your-router-bearer-key-here"
