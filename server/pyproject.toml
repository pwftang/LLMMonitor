[project]
name = "llmmonitor-hub"
version = "0.1.0"
description = "Multi-device omlx + Apple Silicon monitoring hub"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
